# Papers shown under the "Under review" tab on the About and Publications pages.
# `authors` and `mentors` are names from _data/people.yml; a trailing * marks equal contribution,
# and a trailing ^N (e.g. "Name^1") shows a numbered superscript.
# `figure` (optional) is a file in assets/img/publication_preview/; `figure_alt` describes it.
- title: "Not All in One View: Bringing Evidence Together for Training-Free Chart and Table Question Answering"
  authors: ["Abrar Zahin Raihan*", "Aurchi Chowdhury*", "Nazia Tasnim"]
  figure: cr1r-pipeline.jpg
  figure_alt: "CR1R pipeline: importance map, rectify and gate, connected components, rank-1 refinement, then one crop per component passed to a frozen VLM"
  abstract: >-
    Multimodal large language models struggle to read fine-grained evidence in charts and tables under constrained visual-token budgets. Training-free cropping can improve evidence access, but a single window must balance coverage of separated evidence against the detail needed to read it. We propose Component-wise Rank-1 Refinement (CR1R), which separates visually supported grounding responses into connected components and selects complementary crops without updating model parameters. CR1R adjusts the importance scores within each region to favor consistent row and column patterns, while leaving locations with zero scores unchanged. Experiments across ten chart and table benchmarks and four frozen backbones show downstream gains, with up to a 4.86-percentage-point improvement in table macro accuracy over the entropy-gradient grounding baseline, alongside better evidence alignment in all ten evaluated backbone-map pairings. Further results show that these views can complement extracted text and higher global resolution, with benefits extending beyond chart and table QA. Together, these findings establish a practical way to improve access to chart and table evidence and highlight evidence organization as a useful direction for training-free multimodal inference.

- title: "MemPMI: Test-Time Auditing of World-Model Memory"
  authors: ["Abrar Zahin Raihan*", "Aurchi Chowdhury*", "Nazia Tasnim"]
  figure: mempmi-memory-audit.jpg
  figure_alt: "MemPMI on Minecraft and Loopcraft: an out-of-date memory frame, the model's prediction with it, the MemPMI map locating the change, and the prediction after forgetting it"
  abstract: >-
    Video world models keep a memory of past frames to stay consistent when the camera returns to a place. When the world changes between visits, a memory frame can show a state that no longer holds, and a model that trusts it draws the old state. Recency, camera overlap and image similarity all rate such out-of-date memory as a good match. We propose MemPMI, a training-free, test-time audit that asks the frozen world model itself. MemPMI scores a memory by the model's denoising loss with irrelevant memories minus its loss with the memory. With the weighting of the evidence lower bound (ELBO), this score estimates the pointwise mutual information (PMI) between the view and the memory. It has the same zero point for every model, and its map over the view shows where a memory contradicts it. On eight released world models and five datasets, MemPMI detects out-of-date memory, tells which of two views a memory contradicts, and locates the change better than image, camera, learned and raw-likelihood baselines, even when the memory was seen from a very different angle. Without generating video, it also measures how much each model uses its memory, and forgetting the frames it flags improves later predictions.

- title: "Nothing to Attend To: Redundancy, Not Synergy, in Multimodal Molecular Property Prediction"
  authors: ["Abrar Zahin Raihan^1", "Aurchi Chowdhury^1", "Md Toki Tahmid^2", "Tanjeem Azwad Zaman^2", "Era Sanjida Islam^3", "M. Saifur Rahman"]
  figure: nothing-to-attend-architecture.jpg
  figure_alt: "A molecule is encoded as SMILES, a molecular graph and a line graph by a frozen chemical language model and two graph autoencoders; linear probes show the language model already captures the properties the graph encoders capture"
  abstract: >-
    Multimodal molecular property predictors typically assume that different views of a molecule carry complementary information, and that exploiting it requires a fusion mechanism that models interactions between modalities. We test both assumptions for frozen encoders combined by late fusion: a pretrained chemical language model and two graph autoencoders, evaluated on all eleven MoleculeNet benchmarks over twenty seeds, each with its own scaffold split, using paired significance tests. Adding the graph encoders to the language model changes ROC-AUC by +0.006 on average, with significant gains on three datasets and significant losses on three. Cross-modal attention is the best fusion variant on none of the eleven, and neither a transformer fusion head nor a parameter-matched concatenation baseline changes this; both results hold when the language model is replaced by Morgan fingerprints. Linear probes show that the language model recovers the chemical properties encoded by the graph encoders, including topological ones. Partial information decomposition, with nonlinear estimators that recover planted synergy, finds little synergy between the modalities, the very quantity cross-modal attention is designed to exploit. We derive a criterion for the value of a modality: the conditional information it adds to the modalities already present. Estimated on training data alone, it predicts realised fusion gains across 18 modality additions and three fusion heads (Spearman ρ ≈ 0.5), better than the information the modality carries on its own. Three-dimensional geometry illustrates the criterion: it improves solvation prediction but degrades binding prediction, where it adds no usable information.
